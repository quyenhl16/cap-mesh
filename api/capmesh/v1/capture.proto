syntax = "proto3";

package capmesh.v1;

option go_package = "github.com/quyenhl16/cap-mesh/api/capmesh/v1;capmeshv1";

service AgentService {
  rpc Connect(stream AgentMessage) returns (stream AgentCommand);
}

service CaptureService {
  rpc CreateSession(CreateSessionRequest) returns (CaptureSession);
  rpc StopSession(StopSessionRequest) returns (CaptureSession);
  rpc GetSession(GetSessionRequest) returns (CaptureSession);
  rpc StreamPackets(StreamPacketsRequest) returns (stream PacketBatch);
  rpc StartContinuousCapture(StartContinuousCaptureRequest) returns (ContinuousCapture);
  rpc StopContinuousCapture(StopContinuousCaptureRequest) returns (ContinuousCapture);
  rpc GetContinuousCapture(GetContinuousCaptureRequest) returns (ContinuousCapture);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc StartWorkloadLogCapture(StartWorkloadLogCaptureRequest) returns (WorkloadLogCapture);
  rpc StopWorkloadLogCapture(StopWorkloadLogCaptureRequest) returns (WorkloadLogCapture);
  rpc GetWorkloadLogCapture(GetWorkloadLogCaptureRequest) returns (WorkloadLogCapture);
}

message AgentMessage {
  RegisterAgent register = 1;
  Heartbeat heartbeat = 2;
  CaptureStatus status = 3;
  PacketBatch batch = 4;
}

message AgentCommand {
  StartCapture start = 1;
  StopCapture stop = 2;
}

message RegisterAgent {
  string node_name = 1;
  map<string, string> interfaces = 2;
}

message Heartbeat {
  int64 timestamp_ns = 1;
}

message CaptureStatus {
  string session_id = 1;
  string node_name = 2;
  string state = 3;
  string error = 4;
  string source_id = 5;
}

message StartCapture {
  string session_id = 1;
  string logical_interface = 2;
  string filter = 3;
  uint32 snaplen = 4;
  CaptureSource source = 5;
}

message StopCapture {
  string session_id = 1;
  string source_id = 2;
}

message CaptureSource {
  string id = 1;
  string target_id = 2;
  string target_type = 3;
  string node_name = 4;
  string logical_interface = 5;
  string interface_name = 6;
  string namespace = 7;
  string pod_name = 8;
  string pod_uid = 9;
  string pod_ip = 10;
}

message PacketBatch {
  string session_id = 1;
  string node_name = 2;
  string interface_name = 3;
  repeated Packet packets = 4;
  CaptureSource source = 5;
}

message Packet {
  int64 timestamp_ns = 1;
  uint32 captured_length = 2;
  uint32 original_length = 3;
  uint32 link_type = 4;
  uint64 sequence_number = 5;
  bytes data = 6;
}

message CreateSessionRequest {
  repeated string nodes = 1;
  string logical_interface = 2;
  string filter = 3;
  uint32 snaplen = 4;
  uint32 ttl_seconds = 5;
  uint32 reorder_window_ms = 6;
  repeated CaptureTarget targets = 7;
}

message StartContinuousCaptureRequest {
  repeated CaptureTarget targets = 1;
  string filter = 2;
  uint32 snaplen = 3;
  uint32 reorder_window_ms = 4;
}

message StopContinuousCaptureRequest {}
message GetContinuousCaptureRequest {}

message ContinuousCapture {
  string session_id = 1;
  string status = 2;
  int64 started_at_ns = 3;
  uint64 retained_size = 4;
  uint32 segment_count = 5;
  string message = 6;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

message AgentInfo {
  string node_name = 1;
  map<string, string> interfaces = 2;
  int64 connected_at_ns = 3;
  int64 last_seen_at_ns = 4;
  string status = 5;
}

message ListSessionsRequest {
  string status = 1;
  string mode = 2;
}

message ListSessionsResponse {
  repeated CaptureSession sessions = 1;
}

message WorkloadLogTarget {
  string namespace = 1;
  string kind = 2;
  string name = 3;
  repeated string containers = 4;
  uint32 max_pods = 5;
}

message StartWorkloadLogCaptureRequest {
  repeated WorkloadLogTarget targets = 1;
  uint32 since_seconds = 2;
}

message StopWorkloadLogCaptureRequest {}
message GetWorkloadLogCaptureRequest {}

message WorkloadLogCapture {
  string run_id = 1;
  string status = 2;
  int64 started_at_ns = 3;
  uint64 retained_size = 4;
  uint32 segment_count = 5;
  uint32 active_streams = 6;
  string message = 7;
  repeated WorkloadLogTarget targets = 8;
}

message CaptureTarget {
  string id = 1;
  InterfaceTarget interface_target = 2;
  WorkloadTarget workload_target = 3;
}

message InterfaceTarget {
  repeated string nodes = 1;
  string logical_interface = 2;
}

message WorkloadTarget {
  string namespace = 1;
  string kind = 2;
  string name = 3;
  string direction = 4;
  bool follow = 5;
  uint32 max_pods = 6;
}

message StopSessionRequest { string session_id = 1; }
message GetSessionRequest { string session_id = 1; }
message StreamPacketsRequest { string session_id = 1; }

message CaptureSession {
  string id = 1;
  repeated string nodes = 2;
  string logical_interface = 3;
  string filter = 4;
  uint32 snaplen = 5;
  int64 created_at_ns = 6;
  int64 expires_at_ns = 7;
  string status = 8;
  string message = 9;
  repeated CaptureTarget targets = 10;
  string mode = 11;
}
