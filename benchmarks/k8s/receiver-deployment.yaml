apiVersion: apps/v1
kind: Deployment
metadata:
  name: capmesh-benchmark-receiver
  labels:
    app.kubernetes.io/name: capmesh-benchmark
    app.kubernetes.io/component: receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: capmesh-benchmark
      app.kubernetes.io/component: receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capmesh-benchmark
        app.kubernetes.io/component: receiver
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: capmesh-benchmark:latest
          imagePullPolicy: IfNotPresent
          args: ["receiver", "--listen=:9000"]
          ports:
            - name: traffic
              protocol: UDP
              containerPort: 9000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              memory: 128Mi
