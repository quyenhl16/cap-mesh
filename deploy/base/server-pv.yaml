apiVersion: v1
kind: PersistentVolume
metadata:
  name: capmesh-captures-local
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: capmesh-local
  local:
    path: /var/lib/capmesh/captures
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - REPLACE_WITH_STORAGE_NODE_HOSTNAME
