apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: capmesh-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: capmesh-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capmesh-agent
    spec:
      serviceAccountName: capmesh-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: agent
          image: capmesh-agent:latest
          imagePullPolicy: IfNotPresent
          args:
            - --server=$(CAPMESH_SERVER)
            - --node=$(NODE_NAME)
            - --interfaces-from-kubernetes=true
            - --tls-ca=/var/run/capmesh/tls/ca.crt
            - --tls-server-name=$(CAPMESH_TLS_SERVER_NAME)
            - --metrics-listen=:9091
            - --capture-log-interval=10s
          envFrom:
            - configMapRef:
                name: capmesh-config
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CAPMESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: capmesh-auth
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW", "NET_ADMIN"]
          ports:
            - name: metrics
              containerPort: 9091
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tls
              mountPath: /var/run/capmesh/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: capmesh-tls
