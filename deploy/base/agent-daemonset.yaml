apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: capmesh-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: capmesh-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capmesh-agent
    spec:
      serviceAccountName: capmesh-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: agent
          image: capmesh-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: capmesh-config
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CAPMESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: capmesh-auth
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW", "NET_ADMIN"]
          ports:
            - name: metrics
              containerPort: 19091
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tls
              mountPath: /var/run/capmesh/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: capmesh-tls
