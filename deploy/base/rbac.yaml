apiVersion: v1
kind: ServiceAccount
metadata:
  name: capmesh-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capmesh-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capmesh-agent-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capmesh-agent-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capmesh-agent-node-reader
subjects:
  - kind: ServiceAccount
    name: capmesh-agent
    namespace: capmesh
