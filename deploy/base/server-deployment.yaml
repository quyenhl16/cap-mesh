apiVersion: apps/v1
kind: Deployment
metadata:
  name: capmesh-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: capmesh-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capmesh-server
    spec:
      serviceAccountName: capmesh-server
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: server
          image: capmesh-server:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: capmesh-config
          env:
            - name: CAPMESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: capmesh-auth
                  key: token
          ports:
            - name: grpc
              containerPort: 18443
            - name: metrics
              containerPort: 19090
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tls
              mountPath: /var/run/capmesh/tls
              readOnly: true
            - name: captures
              mountPath: /app/captures
      volumes:
        - name: tls
          secret:
            secretName: capmesh-tls
        - name: captures
          persistentVolumeClaim:
            claimName: capmesh-captures
