apiVersion: v1
kind: ConfigMap
metadata:
  name: capmesh-config
data:
  # Server
  CAPMESH_SERVER_LISTEN: ":18443"
  CAPMESH_SERVER_METRICS_LISTEN: ":19090"
  # Disabled by default; set to ":16060" temporarily when collecting profiles.
  CAPMESH_SERVER_PPROF_LISTEN: ""
  # Sample one out of every N packets for reorder-wait latency.
  CAPMESH_METRICS_SAMPLE_EVERY: "1024"
  CAPMESH_SERVER_REBATCH_MAX_PACKETS: "256"
  CAPMESH_SERVER_REBATCH_MAX_BYTES: "1048576"
  CAPMESH_SERVER_REBATCH_MAX_DELAY: 1ms
  CAPMESH_TLS_CERT: /var/run/capmesh/tls/tls.crt
  CAPMESH_TLS_KEY: /var/run/capmesh/tls/tls.key
  CAPMESH_SUBSCRIBER_QUEUE_SIZE: "256"
  CAPMESH_RECORD_DIR: /app/captures
  # Per-session/rolling limits shared by PCAP and workload-log recording.
  CAPMESH_RECORD_SEGMENT_SIZE: 10MiB
  CAPMESH_RECORD_MAX_SESSION_SIZE: 10GiB
  # Combined quota for dated normal-session directories only.
  CAPMESH_RECORD_MAX_NORMAL_TOTAL_SIZE: 50GiB
  CAPMESH_RECORD_QUEUE_SIZE: "256"
  CAPMESH_WORKLOAD_RECONCILE_INTERVAL: 5s

  # Agent
  CAPMESH_SERVER: capmesh-server:18443
  CAPMESH_TLS_CA: /var/run/capmesh/tls/ca.crt
  CAPMESH_TLS_SERVER_NAME: capmesh-server
  CAPMESH_DUMPCAP: dumpcap
  # auto prefers AF_PACKET/TPACKET_V3 and falls back to dumpcap only when the
  # socket cannot be initialized. Benchmarks should select a strict engine.
  CAPMESH_CAPTURE_ENGINE: auto
  CAPMESH_CAPTURE_RING_SIZE: 64MiB
  CAPMESH_CAPTURE_BLOCK_SIZE: 1MiB
  CAPMESH_CAPTURE_RING_BUDGET: 512MiB
  CAPMESH_CAPTURE_BLOCK_TIMEOUT: 1ms
  CAPMESH_CAPTURE_POLL_TIMEOUT: 1ms
  CAPMESH_INSECURE: "false"
  CAPMESH_AGENT_METRICS_LISTEN: ":19091"
  # Disabled by default; set to ":16061" temporarily when collecting profiles.
  CAPMESH_AGENT_PPROF_LISTEN: ""
  CAPMESH_AGENT_BATCH_MAX_PACKETS: "256"
  CAPMESH_AGENT_BATCH_MAX_BYTES: "1048576"
  CAPMESH_AGENT_BATCH_MAX_DELAY: 1ms
  CAPMESH_CAPTURE_LOG_INTERVAL: 10s
  CAPMESH_INTERFACES_FROM_KUBERNETES: "true"
  CAPMESH_INTERFACES: ""
  CAPMESH_INTERFACE_A: ""
  CAPMESH_INTERFACE_B: ""
  CAPMESH_INTERFACE_C: ""
